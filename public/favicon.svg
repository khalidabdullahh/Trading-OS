<svg viewBox="0 0 120 120" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="tosHexBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22d3ee" />
      <stop offset="30%" stop-color="#0284c7" />
      <stop offset="70%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>

    <radialGradient id="tosShieldBg" cx="50%" cy="30%" r="75%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#090e1a" />
      <stop offset="100%" stop-color="#030712" />
    </radialGradient>

    <linearGradient id="tosMonogramCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#67e8f9" />
      <stop offset="50%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <linearGradient id="tosMonogramBlue" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="50%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#60a5fa" />
    </linearGradient>

    <linearGradient id="tosMonogramSurge" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
  </defs>

  <!-- 1. Outer 3D Hexagonal Cyber-Shield Badge -->
  <polygon
    points="60,6 108,34 108,86 60,114 12,86 12,34"
    fill="url(#tosShieldBg)"
    stroke="url(#tosHexBorder)"
    stroke-width="5"
    stroke-linejoin="round"
  />

  <!-- 2. Inner Beveled Glass Layer -->
  <polygon
    points="60,16 98,38 98,82 60,104 22,82 22,38"
    fill="#050814"
    stroke="#38bdf8"
    stroke-width="2"
    stroke-opacity="0.5"
    stroke-linejoin="round"
  />

  <!-- 3. Quantitative Candlestick & Delta Monogram -->
  <!-- Top "T" Crossbar -->
  <path
    d="M30 38 L90 38 L84 48 L66 48 L66 52 L54 52 L54 48 L36 48 Z"
    fill="url(#tosMonogramCyan)"
  />

  <!-- Left Ascent Pillar -->
  <path
    d="M34 54 L48 54 L48 80 L34 70 Z"
    fill="url(#tosMonogramBlue)"
  />

  <!-- Central Quantitative Surge Delta -->
  <path
    d="M54 52 L66 52 L66 84 L60 90 L54 84 Z"
    fill="url(#tosMonogramCyan)"
  />

  <!-- Right Ascending Breakout Wing -->
  <path
    d="M72 54 L86 48 L86 72 L72 82 Z"
    fill="url(#tosMonogramSurge)"
  />
</svg>
